<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Poryadoc - Cours</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Nothing+You+Could+Do&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="/src/css/abstract/var.css">
        <link rel="stylesheet" href="/src/css/base/reset.css">
        <link rel="stylesheet" href="/src/css/components/sidebar.css">
        <link rel="stylesheet" href="/src/css/components/cours/main.css">
        <link rel="stylesheet" href="/src/css/base/responsive/coursResponsive.css">
    </head>
    <body>
        <section class="sidebar">
            <div class="navbar__top">
                <div class="navbar__title-contain">
                    <h2 class="navbar__title">Poryadoc</h2>
                    <h3 class="navbar__subtitle">- пориядок -</h3>
                </div>
                

                <nav class="navbar__navigation">
                    <div class="navbar__buttons">
                        <a href="/index.html" class="navbar__link"><i class="ti ti-home"></i> Accueil</a>
                        <a href="public/pages/cours.html" class="navbar__link active"><i class="ti ti-folder"></i> Cours</a>
                        <a href="" class="navbar__link"><i class="ti ti-cards"></i> Réviser</a>
                        <a href="" class="navbar__link"><i class="ti ti-calendar-event"></i> Calendrier</a>
                    </div>

                    <div class="navbar__searchbar">
                        <i class="ti ti-search searchbar__icon"></i>
                        <input type="search" name="" id="searchbar" class="searchbar__input" placeholder="Rechercher">
                        <span class="searchbar__shortcut">⌘K</span>
                    </div>
                </nav>
            </div>

            <div class="navbar__bottom">
                <a href="" class="navbar__link"><i class="ti ti-settings"></i> Paramètres</a>
            </div>
        </section>

        <section class="main">
            <div class="main__top">
                <div class="top__left">
                    <p class="top__location">Cours / <span id="actualLocation">Maths</span></p>
                </div>

                <div class="top__right">
                    <button class="button__add-chapter"><i class="ti ti-plus"></i> Nouveau chapitre</button>
                </div>
            </div>

            <div class="main__subject-selection">
                <table class="subject__table">
                    <tr>
                        <td class="subject__subject">
                            <i class="ti ti-folder"></i>
                            <p class="subject__name">Maths</p>
                            <p class="subject__chapter-count"><span id="chapterCount">4</span> chapitres</p>
                        </td>
                        <td class="subject__subject"></td>
                        <td class="subject__subject"></td>
                    </tr>
                </table>
            </div>
        </section>
    </body>
</html>
